name: release-desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag matches project version
        shell: bash
        run: |
          set -euo pipefail

          read_json_version() {
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -n 1
          }

          read_toml_version() {
            sed -n 's/^version = "\([^"]*\)"$/\1/p' "$1" | head -n 1
          }

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(read_json_version package.json)"
          tauri_version="$(read_json_version src-tauri/tauri.conf.json)"
          cargo_version="$(read_toml_version src-tauri/Cargo.toml)"

          if [ -z "$package_version" ] || [ -z "$tauri_version" ] || [ -z "$cargo_version" ]; then
            echo "::error::Failed to read one or more project versions."
            exit 1
          fi

          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch across files: package.json=$package_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version"
            exit 1
          fi

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag version v$tag_version does not match project version $package_version"
            exit 1
          fi

          echo "Release version validated: $package_version"

  build:
    name: release-build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            artifact_name: release-macos
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis,msi
            artifact_name: release-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release bundles
        run: bunx tauri build --bundles "${{ matrix.bundles }}" --no-sign

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
          fail_on_unmatched_files: false
          generate_release_notes: true
