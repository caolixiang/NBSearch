name: release-desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag matches project version
        shell: bash
        run: |
          set -euo pipefail

          read_json_version() {
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -n 1
          }

          read_toml_version() {
            sed -n 's/^version = "\([^"]*\)"$/\1/p' "$1" | head -n 1
          }

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(read_json_version package.json)"
          tauri_version="$(read_json_version src-tauri/tauri.conf.json)"
          cargo_version="$(read_toml_version src-tauri/Cargo.toml)"

          if [ -z "$package_version" ] || [ -z "$tauri_version" ] || [ -z "$cargo_version" ]; then
            echo "::error::Failed to read one or more project versions."
            exit 1
          fi

          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch across files: package.json=$package_version, tauri.conf.json=$tauri_version, Cargo.toml=$cargo_version"
            exit 1
          fi

          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag version v$tag_version does not match project version $package_version"
            exit 1
          fi

          echo "Release version validated: $package_version"

  build:
    name: release-build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            artifact_name: release-macos
            updater_dir: src-tauri/target/release/bundle/macos
            updater_glob: '*.app.tar.gz'
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/release/bundle/macos/updater-platform.json
          - os: windows-latest
            bundles: nsis,msi
            artifact_name: release-windows
            updater_dir: src-tauri/target/release/bundle/nsis
            updater_glob: '*.exe'
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/nsis/updater-platform.json
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate updater signing config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NBSEARCH_UPDATER_PUBKEY: ${{ vars.NBSEARCH_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || {
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }
          test -n "${NBSEARCH_UPDATER_PUBKEY:-}" || {
            echo "::error::Missing repo variable NBSEARCH_UPDATER_PUBKEY"
            exit 1
          }

      - name: Build release bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NBSEARCH_UPDATER_PUBKEY: ${{ vars.NBSEARCH_UPDATER_PUBKEY }}
          NBSEARCH_UPDATER_ENDPOINT: ${{ vars.NBSEARCH_UPDATER_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${NBSEARCH_UPDATER_ENDPOINT:-}" ]; then
            export NBSEARCH_UPDATER_ENDPOINT="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          fi
          bunx tauri build --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.updater.conf.json

      - name: Collect updater metadata
        shell: bash
        run: |
          set -euo pipefail

          host_triple="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host_triple" in
            x86_64-apple-darwin) updater_target="darwin-x86_64" ;;
            aarch64-apple-darwin) updater_target="darwin-aarch64" ;;
            x86_64-pc-windows-msvc) updater_target="windows-x86_64" ;;
            aarch64-pc-windows-msvc) updater_target="windows-aarch64" ;;
            i686-pc-windows-msvc) updater_target="windows-i686" ;;
            *)
              echo "::error::Unsupported updater host triple: $host_triple"
              exit 1
              ;;
          esac

          updater_bundle="$(find "${{ matrix.updater_dir }}" -maxdepth 1 -type f -name "${{ matrix.updater_glob }}" | head -n 1)"
          test -n "$updater_bundle" || {
            echo "::error::Updater bundle not found under ${{ matrix.updater_dir }}"
            exit 1
          }

          updater_sig="${updater_bundle}.sig"
          test -f "$updater_sig" || {
            echo "::error::Updater signature not found: $updater_sig"
            exit 1
          }

          signature="$(tr -d '\r\n' < "$updater_sig")"
          bundle_name="$(basename "$updater_bundle")"
          metadata_path="${{ matrix.updater_dir }}/updater-platform.json"

          printf '%s\n' \
            '{' \
            "  \"target\": \"$updater_target\"," \
            "  \"bundle\": \"$bundle_name\"," \
            "  \"signature\": \"$signature\"" \
            '}' > "$metadata_path"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate updater manifest
        shell: bash
        env:
          NBSEARCH_UPDATER_ASSET_BASE_URL: ${{ vars.NBSEARCH_UPDATER_ASSET_BASE_URL }}
        run: |
          set -euo pipefail
          args=(
            scripts/generate-updater-manifest.mjs
            --version "${GITHUB_REF_NAME#v}"
            --repo "${GITHUB_REPOSITORY}"
            --tag "${GITHUB_REF_NAME}"
            --artifacts-dir release-artifacts
            --out release-artifacts/latest.json
          )
          if [ -n "${NBSEARCH_UPDATER_ASSET_BASE_URL:-}" ]; then
            args+=(--base-url "${NBSEARCH_UPDATER_ASSET_BASE_URL}")
          fi
          bun "${args[@]}"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.sig
            release-artifacts/**/*.app.tar.gz
            release-artifacts/latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
